services:
  - type: web
    name: antim-rupee-api
    env: python
    region: singapore # Adjust as needed
    buildCommand: "cd api && pip install -r requirements.txt && python ingest.py && python engine.py"
    startCommand: "cd api && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DB_PATH
        value: /opt/render/project/src/api/data/warehouse.duckdb
      - key: OPENROUTER_API_KEY
        sync: false # Must be set in Render dashboard manually
      - key: CORS_ORIGINS
        sync: false # Set to your Vercel URL in Render dashboard
